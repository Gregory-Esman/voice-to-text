# Voice-To-Text — Windows config (online / Groq mode).
# Copy to one of:
#   %APPDATA%\Voice-To-Text\config.toml      (recommended)
#   windows\config.toml                       (next to app.py)
# or point VTT_CONFIG at this file. All keys are optional — these are the defaults.

[transcription]
base_url = "https://api.groq.com/openai/v1"
model = "whisper-large-v3"
language = "en"            # "" to auto-detect
vocabulary = ""            # names/jargon to bias spelling, comma-separated
api_key_env = "GROQ_API_KEY"
api_key_file = "groq_key"  # Credential Manager account name (service "voice-to-text")

[formatting]
# The Left-Alt "Write / Edit" key (drafts replies, edits selected text).
command_base_url = "https://api.groq.com/openai/v1"
command_model = "openai/gpt-oss-120b"
api_key_env = "GROQ_API_KEY"
api_key_file = "groq_key"

[dictation]
# Clean up plain dictation (the tilde key) into written text — fixes punctuation,
# run-ons and removes um/uh, keeping your words and voice (light/faithful).
clean = true
# stream = clean each pause-delimited chunk DURING your pauses, so the work
# happens in the dead time and only the short final tail is processed at tap-stop
# (no on-screen flash). false = one cleanup pass at tap-stop instead.
stream = true
# A SMALL, fast model — cleanup is easy and the tail's latency is what you feel.
# Kept separate from the heavier [formatting] Write model.
model = "llama-3.1-8b-instant"
tone = ""                    # "excited" lets an energetic delivery earn a "!"

[hotkey]
dictate_key = "ctrl_r"       # tap Right Ctrl — manual dictation (tap to start, tap to stop)
toggle_auto_key = "tilde"    # tap the tilde key — turn Auto-Dictate on/off (text box = live mic)
# The tilde key is suppressed while running (never types ` or ~). With Auto-Dictate on,
# spoken write/edit/send commands are detected automatically — no separate command key.
# Alternatives: "f9", "ctrl_r", "tilde". Avoid "alt" and "f10" (they pop the window menu bar).

[personal]
# YOUR details (set them in Settings, or here). Used to spell your name right,
# fix spoken email forms ("jamie at example dot com" -> your real address), and
# power the "type my email" / "enter my name" voice snippets. Never shared
# beyond the transcription request.
name = ""
email = ""

[replacements]
# Literal transcript fixups, applied case-insensitively: "what whisper types" = "what you meant"

[auto_dictate]
# Hands-free mode: a focused text box = live mic. Requires voice enrollment
# (Settings -> "Enroll my voice"); your speech is verified ON-DEVICE before
# any audio is uploaded, and audio the PC itself plays (videos/music) is
# filtered out via a local loopback check.
enabled = false
similarity = 0.60        # your-voice match threshold (lower = more permissive)
silence_ms = 700         # pause length that ends an utterance
min_speech_ms = 180      # speech needed to start capturing
start_rms = 0.014        # loudness gate to start / stop capturing
end_rms = 0.008
echo_corr = 0.55         # speaker-echo correlation above this = dropped
adapt = true             # profile learns from high-confidence utterances
send_in_terminal = false # "send it" pressing Enter in terminals (danger: executes)
exclude_apps = []        # exe names that never auto-arm, e.g. ["keepass"]
