name: Build Windows release

# Builds the Windows onedir bundle on a Windows runner as a downloadable sanity
# artifact. The SHIPPING release (Voice-To-Text-Setup.exe, the Inno Setup
# installer) is built locally via ISCC and pushed with `gh release create` — see
# windows\installer\VoiceToText.iss. This runner build does NOT produce the
# installer (Inno isn't on the runner) and no longer runs on tags, so a normal
# release no longer triggers a spurious failure. Run it manually if you want a
# runner-side build without a local Windows box.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r windows/requirements-windows.txt
          pip install pyinstaller==6.11.1

      - name: Build .exe
        run: pyinstaller --noconfirm windows/VoiceToText.spec

      - name: Selftest the bundle
        run: dist/VoiceToText/VoiceToText.exe --selftest

      - name: Package zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          # onedir: the exe needs its whole folder alongside it, not just the .exe
          Copy-Item -Recurse dist/VoiceToText release/VoiceToText
          Copy-Item windows/config.example.toml release/
          Copy-Item windows/README.md release/README.txt
          Compress-Archive -Force -Path release/* -DestinationPath Voice-To-Text-Windows.zip

      - name: Upload build artifact (always)
        uses: actions/upload-artifact@v4
        with:
          name: Voice-To-Text-Windows
          path: Voice-To-Text-Windows.zip
